<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Domasna 3</title>
</head>
<body>
    <div class="layout">
        <div class="main">
            <div class="setup-container">
                <div class="header1">
                    <h1>Formula 1 Simulator</h1>
                </div>
                <div class="header2">
                    <h2>Race Control</h2>
                </div>
                <div class="ldsc-container">
                    <div class="l-box">
                        <h3>Lap</h3>
                    </div>
                    <div class="d-box">
                        <h3>Drivers</h3>
                    </div>
                    <div class="sc-box">
                        <h3>Safety Car</h3>
                    </div>
                </div>
                <div class="ldsc-values-container">
                    <div class="l-box-value">
                        <p id="current-lap"></p>
                    </div>
                    <div class="d-box-value">
                        <p>10</p>
                    </div>
                    <div class="sc-box-value">
                        <p id="safety-car-status"></p>
                    </div>
                </div>
                <div class="race-buttons-container">
                    <button class="next-lap" id="next-lap">Next Lap</button>
                    <button class="start-race" id="start-race">Start Race</button>
                    <button class="reset-race" id="reset-race">Reset Race</button>
                </div>
            </div>
            <div class="standings-container">
                <div class="standings-header">
                    <h2>Race Standings</h2>
                </div>
                <div class="standings-table">
                    <table>
                        <thead>
                            <tr>
                                <th>Position</th>
                                <th>Driver / Team</th>
                                <th>Tires</th>
                                <th>Time</th>
                            </tr>
                        </thead>
                        <tbody id="standings-body">
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="events-container">
                <div class="events-header">
                    <h2>Race Events</h2>
                </div>
                <div class="events-list">
                    <ul id="events-list">
                    </ul>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
