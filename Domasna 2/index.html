<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Domasna 2</title>
</head>
<body>    
    <div class="layout">
        <div class="sidebar">
            <div class="navigation">
                <h2>Navigation</h2>
            </div>
            <div class="rooms-nav-box">
                <div class="rooms-nav-container">
                    <div class="bedroom-nav room-nav-item">
                        <a href="#bedroom">Bedroom</a>
                    </div>
                    <div class="living-room-nav room-nav-item">
                        <a href="#living-room">Living Room</a>
                    </div>
                    <div class="kitchen-nav room-nav-item">
                        <a href="#kitchen">Kitchen</a>
                    </div>
                    <div class="garden-nav room-nav-item">
                        <a href="#garden">Garden</a>
                    </div>
                    <div class="notifications-nav room-nav-item">
                        <a href="#notifications">Notifications</a>
                    </div>
                </div>
            </div>
        </div>
        <div class="main">
            <div class="header">
                <h1>Smart Home Control Panel</h1>
            </div>
            <div class="rooms-box">
                <div class="bedroom room-item" id="bedroom">
    
                </div>
                <div class="living-room room-item" id="living-room">
    
                </div>
                <div class="kitchen room-item" id="kitchen">
    
                </div>
                <div class="garden room-item" id="garden">
    
                </div>
            </div>
            <div class="notifications" id="notifications">

            </div>
        </div>
    </div>
</body>
</html>
